# End-to-end test of the trustvian-run and trustvian-comment actions (task 079).
#
# Runs the action itself — the real pinned runtime build, the real CLI, the
# real control plane and the real Collector — against model-free scenarios
# (scripts/testdata/trustvian-run), and checks that every outcome is passed
# through and preserved:
#
#   pass         a single scenario PASS        → exit 0, result present,
#                under a hostile Go, Git and CDPATH environment, first, so
#                the runtime is fetched and built under it
#   suite        a suite with a FAIL member    → exit 1, result present
#   operational  a crashing candidate          → exit 3, no result document
#   usage        a suite with no deadline      → exit 2, no result document
#
# A second job downloads the artifacts the first uploaded and checks them,
# which is the hand-off the reporting slice will rely on. It then renders each
# one with cmd/trustvian-ci-render, built from this same commit, so the
# renderer is held to what the pinned runtime actually produces rather than
# only to its checked-in fixtures.
#
# A third job posts a real gate comment on this repository's own pull request
# through the comment action, reads it back, and then replaces it with a
# no-verdict rendering — the failure task 079 names the worst, on the real
# API. It is the only job here holding a write scope, and why it may run a
# local action is stated where it is defined. No job uses a secret, and no
# checkout keeps a credential. This is not the copyable example; that is
# examples/github-actions/behavioral-gate.yml.

name: trustvian-run action

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/actions/trustvian-run/**"
      - ".github/actions/trustvian-comment/**"
      - ".github/workflows/trustvian-run-action.yml"
      - "scripts/testdata/trustvian-run/**"
      - "processor/cmd/agent-producer/**"
      - "cmd/trustvian-ci-render/**"
      - "cmd/trustvian-ci-comment/**"
  push:
    branches: [main]
    paths:
      - ".github/actions/trustvian-run/**"
      - ".github/actions/trustvian-comment/**"
      - ".github/workflows/trustvian-run-action.yml"
      - "scripts/testdata/trustvian-run/**"
      - "processor/cmd/agent-producer/**"
      - "cmd/trustvian-ci-render/**"
      - "cmd/trustvian-ci-comment/**"

# No workflow-level permissions: each job states its own.

concurrency:
  group: trustvian-run-action-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    name: Run the action end to end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    # The exit codes the final step asserted, handed to the artifacts job as
    # the independent context the renderer checks each artifact against.
    outputs:
      pass-exit-code: ${{ steps.pass.outputs.exit-code }}
      suite-exit-code: ${{ steps.suite.outputs.exit-code }}
      operational-exit-code: ${{ steps.operational.outputs.exit-code }}
      usage-exit-code: ${{ steps.usage.outputs.exit-code }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The token is not written into .git/config, so the workload this
          # job runs cannot read it back.
          persist-credentials: false

      # The workload's own toolchain, for the fixture only. The action never
      # uses it: it brings its own pinned Go under $RUNNER_TEMP.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: processor/go.mod
          check-latest: true
          cache: false

      - name: Build the model-free workload
        working-directory: processor
        env:
          GOWORK: "off"
        run: go build -o "$RUNNER_TEMP/agent-producer" ./cmd/agent-producer

      - name: Record the workspace before the action runs
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/workspace-head"
          git status --porcelain=v1 --untracked-files=all > "$RUNNER_TEMP/workspace-status"
          mkdir -p "$RUNNER_TEMP/cdpath/scripts"

      # The job's own Go, Git and shell settings must not reach the runtime
      # the action builds: a toolchain switch, build flags, a Go env file, a
      # repository redirected at this checkout, and a CDPATH offering another
      # directory. First, so the source is fetched and built under them.
      - id: pass
        name: A PASS, under a hostile job environment
        uses: ./.github/actions/trustvian-run
        env:
          GOTOOLCHAIN: go1.27.0+path
          GOFLAGS: -mod=vendor -toolexec=/bin/false
          GOENV: /nonexistent/go.env
          GOPROXY: "off"
          GIT_DIR: ${{ github.workspace }}/.git
          GIT_WORK_TREE: ${{ github.workspace }}
          CDPATH: ${{ runner.temp }}/cdpath
        with:
          scenario: scripts/testdata/trustvian-run/pass.yaml
          artifact-name: trustvian-run-pass

      - name: The workspace is exactly as it was
        run: |
          set -euo pipefail
          git rev-parse HEAD | diff - "$RUNNER_TEMP/workspace-head"
          git status --porcelain=v1 --untracked-files=all | diff - "$RUNNER_TEMP/workspace-status"
          echo "ok: the checkout's HEAD, tracked and untracked files are unchanged"

      # continue-on-error here, in this test's own workflow, so the steps
      # below can inspect outcomes the action correctly reports as failures.
      # The action never sets it; see docs/ci-github-action.md.
      - id: suite
        name: A suite with a FAIL member
        continue-on-error: true
        uses: ./.github/actions/trustvian-run
        with:
          suite: scripts/testdata/trustvian-run/suite
          scenario-timeout: 5m
          artifact-name: trustvian-run-suite

      - id: operational
        name: An operational failure
        continue-on-error: true
        uses: ./.github/actions/trustvian-run
        with:
          scenario: scripts/testdata/trustvian-run/operational.yaml
          artifact-name: trustvian-run-operational

      - id: usage
        name: A usage error
        continue-on-error: true
        uses: ./.github/actions/trustvian-run
        with:
          suite: scripts/testdata/trustvian-run/suite
          artifact-name: trustvian-run-usage

      - name: Every code passed through, every result preserved
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PASS_CODE: ${{ steps.pass.outputs.exit-code }}
          PASS_RESULT: ${{ steps.pass.outputs.result }}
          PASS_HEAD: ${{ steps.pass.outputs.head-sha }}
          PASS_OUTCOME: ${{ steps.pass.outcome }}
          SUITE_CODE: ${{ steps.suite.outputs.exit-code }}
          SUITE_RESULT: ${{ steps.suite.outputs.result }}
          SUITE_OUTCOME: ${{ steps.suite.outcome }}
          OPERATIONAL_CODE: ${{ steps.operational.outputs.exit-code }}
          OPERATIONAL_RESULT: ${{ steps.operational.outputs.result }}
          OPERATIONAL_OUTCOME: ${{ steps.operational.outcome }}
          USAGE_CODE: ${{ steps.usage.outputs.exit-code }}
          USAGE_RESULT: ${{ steps.usage.outputs.result }}
          USAGE_OUTCOME: ${{ steps.usage.outcome }}
          RUNTIME_COMMIT: ${{ steps.pass.outputs.runtime-commit }}
        run: |
          set -euo pipefail
          failed=0
          check() {
            if [ "$2" != "$3" ]; then
              echo "::error::$1 is '$2', want '$3'"
              failed=1
            else
              echo "ok: $1 = $2"
            fi
          }
          check "pass exit code" "$PASS_CODE" 0
          check "pass result" "$PASS_RESULT" present
          check "pass step outcome" "$PASS_OUTCOME" success
          check "pass head" "$PASS_HEAD" "$EXPECTED_HEAD"
          check "suite exit code" "$SUITE_CODE" 1
          check "suite result" "$SUITE_RESULT" present
          check "suite step outcome" "$SUITE_OUTCOME" failure
          check "operational exit code" "$OPERATIONAL_CODE" 3
          check "operational result" "$OPERATIONAL_RESULT" absent
          check "operational step outcome" "$OPERATIONAL_OUTCOME" failure
          check "usage exit code" "$USAGE_CODE" 2
          check "usage result" "$USAGE_RESULT" absent
          check "usage step outcome" "$USAGE_OUTCOME" failure
          check "runtime commit" "$RUNTIME_COMMIT" "$(sed -n 's/^TRUSTVIAN_SOURCE_COMMIT=//p' .github/actions/trustvian-run/runtime.env)"
          # Only the processes the action started were stopped, and all of them were.
          if pgrep -f trustvian-local >/dev/null; then
            echo "::error::a control plane is still running"
            pgrep -fl trustvian-local
            failed=1
          fi
          exit "$failed"

  artifacts:
    name: The uploaded results are complete
    needs: run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # No checkout: this job only reads what the run job uploaded. A same-run
    # artifact download needs no GITHUB_TOKEN scope, which this job proves by
    # holding none beyond contents: read.
    permissions:
      contents: read

    steps:
      # This commit's source, for the renderer alone: the job runs no
      # scenario and holds no write scope, and the checkout keeps no
      # credential.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false

      - name: Build the renderer
        run: go build -o "$RUNNER_TEMP/trustvian-ci-render" ./cmd/trustvian-ci-render

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: trustvian-run-*
          path: artifacts

      - name: Check every artifact
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          failed=0
          expect() { # name exit_code result_status
            local dir="artifacts/trustvian-run-$1" meta
            meta="$dir/trustvian-run.json"
            if ! [ -f "$meta" ]; then
              echo "::error::$1: no execution metadata"; failed=1; return
            fi
            jq -e --arg head "$EXPECTED_HEAD" --argjson code "$2" --arg result "$3" '
              .version == "1" and .head.sha == $head and .cli.exit_code == $code
              and .result.status == $result' "$meta" >/dev/null ||
              { echo "::error::$1: metadata does not match"; cat "$meta"; failed=1; return; }
            if [ "$3" = present ]; then
              [ "$(sha256sum "$dir/result.json" | cut -d' ' -f1)" = "$(jq -r .result.sha256 "$meta")" ] ||
                { echo "::error::$1: result.json does not match its recorded digest"; failed=1; return; }
              jq -e 'type == "object"' "$dir/result.json" >/dev/null ||
                { echo "::error::$1: result.json is not a JSON object"; failed=1; return; }
            elif [ -e "$dir/result.json" ]; then
              echo "::error::$1: result.json exists without a result"; failed=1; return
            fi
            echo "ok: $1"
          }
          expect pass 0 present
          expect suite 1 present
          expect operational 3 absent
          expect usage 2 absent
          exit "$failed"

      # Each artifact rendered as the comment job will render it, against the
      # identity this job knows independently: the event's head, this run,
      # and the exit codes the run job asserted. A rejection (exit 3) means
      # the renderer and the producer disagree about the contract.
      - name: Render every artifact
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PASS_CODE: ${{ needs.run.outputs.pass-exit-code }}
          SUITE_CODE: ${{ needs.run.outputs.suite-exit-code }}
          OPERATIONAL_CODE: ${{ needs.run.outputs.operational-exit-code }}
          USAGE_CODE: ${{ needs.run.outputs.usage-exit-code }}
        run: |
          set -euo pipefail
          failed=0
          # name, the exit code to pass, the renderer exit wanted, and text
          # its first line must contain ("" for none).
          render() {
            local out="$RUNNER_TEMP/render-$1.md" err="$RUNNER_TEMP/render-$1.err" code=0
            "$RUNNER_TEMP/trustvian-ci-render" \
              --artifact-dir "artifacts/trustvian-run-$1" \
              --head-sha "$EXPECTED_HEAD" \
              --repository "$GITHUB_REPOSITORY" \
              --run-id "$GITHUB_RUN_ID" \
              --run-attempt "$GITHUB_RUN_ATTEMPT" \
              --exit-code "$2" >"$out" 2>"$err" || code=$?
            if [ "$code" = 3 ]; then
              echo "::error::$1: the renderer rejected the artifact"
              cat "$err"
              failed=1
              return
            fi
            if [ "$code" != "$3" ]; then
              echo "::error::$1: the renderer exited $code, want $3"
              cat "$err"
              failed=1
              return
            fi
            local first=""
            IFS= read -r first <"$out" || true
            if [ -n "$4" ] && [[ "$first" != *"$4"* ]]; then
              echo "::error::$1: the rendering's first line lacks '$4'"
              cat "$out"
              failed=1
              return
            fi
            echo "ok: $1 rendered, exit $code"
          }
          render pass "$PASS_CODE" 0 "— PASS"
          render suite "$SUITE_CODE" 0 "behavioral suite"
          render operational "$OPERATIONAL_CODE" 1 ""
          render usage "$USAGE_CODE" 1 ""
          exit "$failed"

  # The real gate comment, on this repository's own pull requests
  # (ADR 0058 § 7).
  #
  # This is the one job anywhere that runs the comment action as a local
  # `./` action, which needs the pull request checked out — so it also needs
  # contents: read. In a write-scoped job that is acceptable here, and only
  # here:
  #   - on a fork pull request, GitHub issues a read-only token, so the job
  #     cannot write, whatever it runs;
  #   - on a same-repository pull request, the author already has write access
  #     to this repository and could change any workflow directly.
  # Neither case grants anyone a capability they lacked. In a consumer's
  # repository the pull request's author is exactly who must not reach the
  # write token, so the shipped example names the action by a reviewed commit
  # and checks nothing out — scripts/trustvian_comment_action_test.go asserts
  # both, and asserts this job is the only exception.
  #
  # The comment it leaves on the pull request is the self-test's own, under
  # the marker trustvian-run-action-e2e, and ends in the no-verdict state.
  comment:
    name: Post and replace a real gate comment
    needs: run
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write

    steps:
      # Only to load ./.github/actions/trustvian-comment. Nothing from this
      # checkout is built or run by the action: it builds the renderer and
      # the poster from the commit runtime.env pins.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: pass
        name: Post the PASS rendering
        uses: ./.github/actions/trustvian-comment
        with:
          exit-code: ${{ needs.run.outputs.pass-exit-code }}
          artifact-name: trustvian-run-pass
          marker-id: trustvian-run-action-e2e

      - name: The pull request holds exactly one gate comment, the PASS for its head
        env:
          GH_TOKEN: ${{ github.token }}
          IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RENDERER_EXIT: ${{ steps.pass.outputs.renderer-exit }}
          POSTED: ${{ steps.pass.outputs.posted }}
          OUTCOME: ${{ steps.pass.outputs.outcome }}
        run: |
          set -euo pipefail
          check() { [ "$2" = "$3" ] || { echo "::error::$1 is '$2', want '$3'"; exit 1; }; echo "ok: $1 = $2"; }
          check "renderer exit" "$RENDERER_EXIT" 0
          if [ "$IS_FORK" = true ]; then
            # A fork's token is read-only: the poster's write is refused, it
            # warns and notes it in the job summary, and the step succeeds.
            check "outcome" "$OUTCOME" not-permitted
            check "posted" "$POSTED" false
            exit 0
          fi
          case "$OUTCOME" in created | updated) echo "ok: outcome = $OUTCOME" ;;
            *) echo "::error::outcome is '$OUTCOME', want created or updated"; exit 1 ;; esac
          check "posted" "$POSTED" true
          marker='<!-- trustvian-behavioral-gate:trustvian-run-action-e2e -->'
          # Read-only: list the comments, as the poster does, and apply its
          # ownership rule independently.
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" >"$RUNNER_TEMP/comments.json"
          jq -s --arg m "$marker" '[add[] | select(.user.login == "github-actions[bot]"
            and ((.body | split("\n")[0] | rtrimstr("\r")) == $m))]' "$RUNNER_TEMP/comments.json" >"$RUNNER_TEMP/ours.json"
          check "gate comments for the marker" "$(jq length "$RUNNER_TEMP/ours.json")" 1
          jq -r '.[0].body' "$RUNNER_TEMP/ours.json" >"$RUNNER_TEMP/body.md"
          check "first line" "$(head -n 1 "$RUNNER_TEMP/body.md" | tr -d '\r')" "$marker"
          grep -qF "$HEAD_SHA" "$RUNNER_TEMP/body.md" || { echo "::error::the comment does not name $HEAD_SHA"; exit 1; }
          grep -qF -- "— PASS" "$RUNNER_TEMP/body.md" || { echo "::error::the comment does not hold the PASS"; exit 1; }
          jq -r '.[0].id' "$RUNNER_TEMP/ours.json" >"$RUNNER_TEMP/comment-id"
          echo "ok: comment $(cat "$RUNNER_TEMP/comment-id") holds the PASS for $HEAD_SHA"

      # The same marker, and an artifact that was never uploaded — as when a
      # run job's upload failed after the CLI exited 0: the renderer's
      # "artifact is missing" no verdict, which must replace the PASS rather
      # than leave it standing.
      - id: no-verdict
        name: Post a no-verdict rendering over it
        uses: ./.github/actions/trustvian-comment
        with:
          exit-code: "0"
          artifact-name: trustvian-run-never-uploaded
          marker-id: trustvian-run-action-e2e

      - name: The same comment now holds no verdict for the head
        env:
          GH_TOKEN: ${{ github.token }}
          IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RENDERER_EXIT: ${{ steps.no-verdict.outputs.renderer-exit }}
          POSTED: ${{ steps.no-verdict.outputs.posted }}
          OUTCOME: ${{ steps.no-verdict.outputs.outcome }}
        run: |
          set -euo pipefail
          check() { [ "$2" = "$3" ] || { echo "::error::$1 is '$2', want '$3'"; exit 1; }; echo "ok: $1 = $2"; }
          check "renderer exit" "$RENDERER_EXIT" 1
          if [ "$IS_FORK" = true ]; then
            check "outcome" "$OUTCOME" not-permitted
            check "posted" "$POSTED" false
            exit 0
          fi
          check "outcome" "$OUTCOME" updated
          check "posted" "$POSTED" true
          marker='<!-- trustvian-behavioral-gate:trustvian-run-action-e2e -->'
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" >"$RUNNER_TEMP/comments.json"
          jq -s --arg m "$marker" '[add[] | select(.user.login == "github-actions[bot]"
            and ((.body | split("\n")[0] | rtrimstr("\r")) == $m))]' "$RUNNER_TEMP/comments.json" >"$RUNNER_TEMP/ours.json"
          check "gate comments for the marker" "$(jq length "$RUNNER_TEMP/ours.json")" 1
          check "comment id" "$(jq -r '.[0].id' "$RUNNER_TEMP/ours.json")" "$(cat "$RUNNER_TEMP/comment-id")"
          jq -r '.[0].body' "$RUNNER_TEMP/ours.json" >"$RUNNER_TEMP/body.md"
          check "first line" "$(head -n 1 "$RUNNER_TEMP/body.md" | tr -d '\r')" "$marker"
          grep -qF "$HEAD_SHA" "$RUNNER_TEMP/body.md" || { echo "::error::the no verdict does not name $HEAD_SHA"; exit 1; }
          grep -qF "### Trustvian behavioral gate — no verdict" "$RUNNER_TEMP/body.md" ||
            { echo "::error::the comment is not the no-verdict state"; cat "$RUNNER_TEMP/body.md"; exit 1; }
          grep -qF "artifact is missing" "$RUNNER_TEMP/body.md" ||
            { echo "::error::the no verdict does not say the artifact is missing"; cat "$RUNNER_TEMP/body.md"; exit 1; }
          if grep -qF -- "— PASS" "$RUNNER_TEMP/body.md"; then
            echo "::error::the stale PASS is still standing"; exit 1
          fi
          echo "ok: the PASS was replaced by no verdict for $HEAD_SHA"
