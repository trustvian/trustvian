# The release pipeline: dispatched, verified, then published.
#
# One path only. `make release VERSION=vX.Y.Z` (scripts/release.sh) dispatches
# this workflow from main with the exact commit to release. Every job up to
# and including `verify` builds, signs and checks; nothing in them is
# irreversible. The image is pushed by digest, with no tag, and an untagged
# digest is not a release. Only `publish` makes anything public, and only after
# `verify` has passed on Linux and macOS.
#
# The human gate is the `release` environment. Every job up to `summary` runs
# in `release-build` (main only, no reviewers). Only `publish` runs in
# `release`, whose required reviewers are the Organization Admins: publish
# waits there until one of them approves the deployment on GitHub, after
# reading the summary job's page. Publish then mints a token for the
# trustvian-release GitHub App, whose key is a secret of that environment,
# and with it creates the annotated tag at the verified commit and the GitHub
# Release. The App is the only actor the "Release tags: creation" ruleset
# lets create a tag, so nothing but an approved publish job can. GITHUB_TOKEN
# pushes the image tags only. scripts/release.sh never creates a tag, never
# handles the App key, and approves only in manual mode, for a person at a
# terminal. See docs/adr/0060-agent-operated-releases-with-environment-approval.md.
#
# There is no tag-push trigger. Pushing a v* tag by hand starts nothing, and
# the guide says so.
#
# History: through v0.9.0 this workflow ran on a tag push and created a draft
# for a human to publish. v0.9.0-rc.1 and rc.2 failed, each failure becoming a
# gate (docs/release-guide.md), and v0.9.0-rc.3 and v0.9.0 passed on
# 2026-09-17. ADR 0059 records why it changed:
# docs/adr/0059-releases-are-dispatched-verified-then-published.md.

name: Release
run-name: >-
  Release ${{ inputs.version }} at ${{ inputs.commit }}${{ inputs.dry_run && ' (dry run)' || '' }} [${{ inputs.operator }}]

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, vMAJOR.MINOR.PATCH[-prerelease]"
        required: true
        type: string
      commit:
        description: "Full commit SHA on main to release (must be main's head at dispatch)"
        required: true
        type: string
      operator:
        description: "Who ran make release: manual (a person at a terminal) or agent (Claude Code, or no terminal). Informational, reported by scripts/release.sh"
        required: true
        type: choice
        options:
          - manual
          - agent
      derivation:
        description: "How the version was derived; shown to the approver (set by scripts/release.sh)"
        required: false
        type: string
        default: ""
      dry_run:
        description: "Build, sign and verify everything, publish nothing"
        required: false
        type: boolean
        default: false

# Two releases never overlap, and a running one is never cancelled: a
# cancellation between publish's steps would leave a partial release for a
# person to finish, where letting it run finishes it.
concurrency:
  group: release
  cancel-in-progress: false

# Nothing at workflow level beyond reading the source. Each job states what it
# needs, and no job before `publish` holds contents: write.
permissions:
  contents: read

env:
  VERSION: ${{ inputs.version }}
  COMMIT: ${{ inputs.commit }}
  # gh's repository, stated rather than inferred from a checkout's remote.
  GH_REPO: ${{ github.repository }}
  # Informational: the mode scripts/release.sh reported. GitHub's own record
  # of who triggered the run and who approved the deployment is the
  # authoritative one; every job's summary shows both side by side.
  OPERATOR: ${{ inputs.operator }}

jobs:
  # ---------------------------------------------------------------------
  # a. Preflight: refuse before anything is built.
  # ---------------------------------------------------------------------
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release-build
    permissions:
      contents: read
      actions: read
    outputs:
      prerelease: ${{ steps.check.outputs.prerelease }}

    steps:

      - name: Operator
        run: |
          echo "**Operator:** \`$OPERATOR\` (as reported by scripts/release.sh; informational) · **Triggered by:** @$GITHUB_TRIGGERING_ACTOR" >> "$GITHUB_STEP_SUMMARY"
      - name: The release App is configured
        # Only the trustvian-release App can create a tag (the "Release tags:
        # creation" ruleset), and publish needs its id. Fail here, before
        # anything is built, rather than after an approval.
        env:
          RELEASE_APP_ID: ${{ vars.RELEASE_APP_ID }}
        run: |
          if ! printf '%s' "$RELEASE_APP_ID" | grep -Eq '^[0-9]+$'; then
            echo "::error::vars.RELEASE_APP_ID is empty or not a number. Create the trustvian-release GitHub App and set the variable: docs/release-runbook.md § 0, The release App (human-only)."
            exit 1
          fi

      - name: Refuse anything but main
        run: |
          # Inputs reach every script through the environment, never by
          # interpolation, so a crafted version string cannot become shell.
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::release.yml runs only from refs/heads/main, not $GITHUB_REF"
            exit 1
          fi
          # The signing identity's workflow SHA is GITHUB_SHA. Requiring the
          # released commit to be exactly that SHA is what lets cosign verify
          # pin --certificate-github-workflow-sha to the released commit, and
          # means the workflow definition that ran is the one being released.
          if [ "$COMMIT" != "$GITHUB_SHA" ]; then
            echo "::error::commit $COMMIT is not main's head at dispatch ($GITHUB_SHA); dispatch again"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.commit }}
          # Full history and main, for "reachable from main".
          fetch-depth: 0

      - id: check
        name: Preflight checks
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPO: ${{ github.repository }}
        run: |
          git fetch --quiet origin +refs/heads/main:refs/remotes/origin/main
          ./scripts/release-preflight.sh "$VERSION" "$COMMIT"

  # ---------------------------------------------------------------------
  # b. Gates, re-run against the exact commit.
  #
  # Not "CI probably passed": preflight requires CI and Nightly to have
  # passed on this commit, and this re-runs the gates whose inputs move
  # without a commit — the vulnerability database above all.
  # ---------------------------------------------------------------------
  gates:
    name: Gates
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release-build
    permissions:
      contents: read

    services:
      # The same PostgreSQL service ci.yml uses, so the release gates cover
      # the persistence guarantees rather than skipping them.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: trustvian
          POSTGRES_PASSWORD: trustvian
          POSTGRES_DB: trustvian_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trustvian -d trustvian_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:

      - name: Operator
        run: |
          echo "**Operator:** \`$OPERATOR\` (as reported by scripts/release.sh; informational) · **Triggered by:** @$GITHUB_TRIGGERING_ACTOR" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.commit }}
          # check-modules.sh verifies declared versions against local tags.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Module consistency
        run: ./scripts/check-modules.sh

      - name: Format
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Race
        run: go test -race ./...

      - name: Test with PostgreSQL
        env:
          TRUSTVIAN_TEST_POSTGRES_DSN: postgres://trustvian:trustvian@localhost:5432/trustvian_test?sslmode=disable
        run: go test -race -short ./...

      - name: Processor module (GOWORK=off)
        env:
          GOWORK: "off"
        working-directory: processor
        run: |
          go build ./...
          go vet ./...
          go test -race ./...

      - name: Go vulnerability scan
        # The vulnerability database moves independently of the code, so a
        # commit that scanned clean when it merged can carry a reachable
        # advisory by the time it is released. Both modules whose code ships.
        env:
          GOWORK: "off"
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...
          (cd processor && go run golang.org/x/vuln/cmd/govulncheck@latest ./...)

  # ---------------------------------------------------------------------
  # c. Build the archives, and attest them.
  # ---------------------------------------------------------------------
  build:
    name: Build archives
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release-build
    permissions:
      contents: read
      # Keyless signing of the build provenance, and storing it.
      id-token: write
      attestations: write

    steps:

      - name: Operator
        run: |
          echo "**Operator:** \`$OPERATOR\` (as reported by scripts/release.sh; informational) · **Triggered by:** @$GITHUB_TRIGGERING_ACTOR" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.commit }}
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Tag the commit locally, so Go stamps the version
        # Go records the main module's version from VCS when HEAD carries a
        # SemVer tag and the tree is clean; there is no -ldflags injection.
        # This tag exists in this runner's clone only: the checkout holds no
        # credential, and nothing here pushes. The real tag is created later
        # by a human Organization Admin, at this same commit.
        run: |
          git -c user.name="Trustvian release" -c user.email="release@invalid" \
            tag -a "$VERSION" -m "Trustvian $VERSION (local, for version stamping)" "$COMMIT"
          test -z "$(git status --porcelain)"

      - name: Build release artifacts
        run: ./scripts/release-build.sh "$VERSION"

      - name: Verify checksums
        working-directory: dist
        run: sha256sum -c checksums.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------
  # d. Build, scan, push by digest, sign.
  #
  # Pushed by digest only: no version tag, no release, nothing `latest` or a
  # version resolves to, so this job publishes no release. The digest and its
  # `sha256-….sig` signature tag are still visible in the package's version
  # list and in the public transparency log, as for any signed image. The version tag, and
  # for a stable release `X.Y` and `latest`, are created by `publish` from
  # this exact digest after `verify` has checked its signature.
  # ---------------------------------------------------------------------
  image:
    name: Container image
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release-build
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image: ${{ steps.name.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}

    steps:

      - name: Operator
        run: |
          echo "**Operator:** \`$OPERATOR\` (as reported by scripts/release.sh; informational) · **Triggered by:** @$GITHUB_TRIGGERING_ACTOR" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.commit }}

      - id: name
        name: Resolve the image repository
        # One source for every step below, so it is not possible to scan one
        # repository and sign another. scripts/image-name.sh lowercases the
        # owner, which v0.9.0-rc.2 failed on.
        run: |
          image="$(./scripts/image-name.sh)"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build for scanning
        # Single platform and --load, because a multi-platform result cannot
        # be loaded into the local daemon for a scanner to read. The push
        # below reuses this build's cache; see docs/supply-chain.md § What
        # the scan covers.
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --load \
            -t "$IMAGE:scan" \
            .

      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:scan
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          scanners: vuln

      - id: push
        name: Build and push by digest
        run: |
          # No -t: push-by-digest stores the multi-arch index, with BuildKit's
          # SBOM (SPDX) and SLSA provenance attestations, under its digest
          # and nothing else.
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --sbom=true \
            --provenance=mode=max \
            --output "type=image,name=$IMAGE,push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file /tmp/metadata.json \
            .

          digest="$(python3 -c "import json;print(json.load(open('/tmp/metadata.json'))['containerimage.digest'])")"
          if ! printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "::error::buildx reported no index digest: '$digest'"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "::notice::pushed $IMAGE@$digest (no tag)"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the digest
        # Keyless: the identity is this run's OIDC token —
        # release.yml@refs/heads/main, triggered by workflow_dispatch, at
        # $COMMIT — so there is no private key anywhere to leak or rotate.
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

  # ---------------------------------------------------------------------
  # e. Verify what will be published, as a consumer would.
  # ---------------------------------------------------------------------
  verify:
    name: Verify (${{ matrix.os }})
    needs: [build, image]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    environment: release-build
    permissions:
      contents: read
      attestations: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:

      - name: Operator
        run: |
          echo "**Operator:** \`$OPERATOR\` (as reported by scripts/release.sh; informational) · **Triggered by:** @$GITHUB_TRIGGERING_ACTOR" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The scenario fixtures and the workload's source; nothing from this
          # checkout is put on the archive's PATH.
          persist-credentials: false
          ref: ${{ inputs.commit }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: processor/go.mod
          cache: false

      - name: Build the model-free workload
        working-directory: processor
        env:
          GOWORK: "off"
        run: go build -o "$RUNNER_TEMP/agent-producer" ./cmd/agent-producer

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: ${{ runner.temp }}/dist

      - name: Checksums, contents and version
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/dist"
          shasum -a 256 -c checksums.txt

          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          case "$(uname -m)" in
            x86_64 | amd64) arch=amd64 ;;
            arm64 | aarch64) arch=arm64 ;;
            *) echo "::error::unexpected architecture $(uname -m)"; exit 1 ;;
          esac
          name="trustvian_${VERSION}_${os}_${arch}"
          mkdir -p "$RUNNER_TEMP/extract"
          tar -xzf "$name.tar.gz" -C "$RUNNER_TEMP/extract"
          bin="$RUNNER_TEMP/extract/$name"
          for b in trustvian trustvian-local trustvian-collector; do
            [ -x "$bin/$b" ] || { echo "::error::$name.tar.gz has no executable $b"; exit 1; }
          done

          got="$("$bin/trustvian" version | head -n 1)"
          if [ "$got" != "trustvian $VERSION" ]; then
            echo "::error::trustvian version printed '$got', want 'trustvian $VERSION'"
            exit 1
          fi
          echo "BIN=$bin" >> "$GITHUB_ENV"
          echo "ok: $name.tar.gz — checksums, three binaries, $got"

      - name: Verify the archives' build provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for f in "$RUNNER_TEMP"/dist/*.tar.gz "$RUNNER_TEMP"/dist/*.zip "$RUNNER_TEMP"/dist/checksums.txt; do
            gh attestation verify "$f" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref refs/heads/main \
              --source-digest "$COMMIT" \
              --deny-self-hosted-runners >/dev/null
            echo "ok: $(basename "$f")"
          done

      - name: End to end, from the archive alone
        # A clean HOME and PATH: the archive's three binaries and the system's
        # /usr/bin and /bin, nothing a toolchain installed. The scenario is the
        # run action's PASS fixture: agent-producer emits the same two tools on
        # both sides, so the gate passes, with no model involved.
        run: |
          set -euo pipefail
          home="$RUNNER_TEMP/clean-home"
          state="$RUNNER_TEMP/control-plane"
          mkdir -p "$home" "$state"
          clean() {
            env -i HOME="$home" PATH="$BIN:/usr/bin:/bin" RUNNER_TEMP="$RUNNER_TEMP" TMPDIR="$RUNNER_TEMP" "$@"
          }

          # env, not the clean() function: a backgrounded function is a subshell,
          # and $! would be its PID rather than trustvian-local's.
          env -i HOME="$home" PATH="$BIN:/usr/bin:/bin" RUNNER_TEMP="$RUNNER_TEMP" TMPDIR="$RUNNER_TEMP" \
            trustvian-local --state-dir "$state" --listen 127.0.0.1:0 >"$RUNNER_TEMP/control-plane.log" 2>&1 &
          cp_pid=$!
          trap 'kill "$cp_pid" 2>/dev/null || true' EXIT

          api=""
          for _ in $(seq 1 600); do
            if [ -f "$state/runtime.json" ]; then
              api="$(sed -n 's/.*"api_url":"\(http:\/\/127\.0\.0\.1:[0-9]*\)".*/\1/p' "$state/runtime.json")"
              [ -z "$api" ] || break
            fi
            kill -0 "$cp_pid" 2>/dev/null || break
            sleep 0.1
          done
          if [ -z "$api" ]; then
            cat "$RUNNER_TEMP/control-plane.log"
            echo "::error::trustvian-local published no endpoint"
            exit 1
          fi

          set +e
          clean trustvian eval run --scenario scripts/testdata/trustvian-run/pass.yaml --api-url "$api"
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "::error::trustvian eval run exited $code, want 0"
            exit 1
          fi
          echo "ok: the PASS scenario passed from the extracted archive"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: runner.os == 'Linux'

      - name: Verify the image signature
        if: runner.os == 'Linux'
        env:
          IMAGE: ${{ needs.image.outputs.image }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          cosign verify "$IMAGE@$DIGEST" \
            --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-github-workflow-repository "$GITHUB_REPOSITORY" \
            --certificate-github-workflow-trigger workflow_dispatch \
            --certificate-github-workflow-sha "$COMMIT" >/dev/null
          echo "ok: $IMAGE@$DIGEST is signed by release.yml on main at $COMMIT"

  # ---------------------------------------------------------------------
  # f. Publish: the only irreversible job, and the only one with
  # contents: write.
  #
  # Idempotent. Every step first checks whether it already happened, so
  # "Re-run failed jobs" finishes a partial publish instead of repeating or
  # contradicting it.
  # ---------------------------------------------------------------------
  # ---------------------------------------------------------------------
  # The page the approver reads before approving publish.
  # ---------------------------------------------------------------------
  summary:
    name: Approval summary
    needs: [preflight, gates, build, image, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release-build
    permissions:
      contents: read
      actions: read

    steps:

      - name: Operator
        run: |
          echo "**Operator:** \`$OPERATOR\` (as reported by scripts/release.sh; informational) · **Triggered by:** @$GITHUB_TRIGGERING_ACTOR" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.commit }}

      - name: Write the approval summary
        env:
          GH_TOKEN: ${{ github.token }}
          DERIVATION: ${{ inputs.derivation }}
          DRY_RUN: ${{ inputs.dry_run }}
          PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
          IMAGE: ${{ needs.image.outputs.image }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          set -euo pipefail
          # The CHANGELOG section that declares the version (or, for a
          # candidate, its base version), verbatim.
          base="${VERSION%%-*}"
          section="$(awk -v v="$base" '
            $0 ~ "^## " v "( |$)" { seen = 1; print; next }
            seen && /^## / { exit }
            seen { print }
          ' CHANGELOG.md)"
          [ -n "$section" ] || section="(CHANGELOG.md has no ## $base section at this commit)"

          # The derivation is free text from whoever dispatched the run, so it
          # is shown as a single code span: newlines, pipes, backticks and
          # angle brackets removed, at most 200 characters. It cannot end the
          # table, add rows, or render a link or an image.
          derivation="$(printf '%s' "${DERIVATION:-not recorded}" | tr '\r\n|`<>' '      ' | cut -c1-200)"

          # A fence longer than any backtick run in the section, so the
          # section cannot close it early.
          longest="$(printf '%s\n' "$section" | { grep -o '``*' || true; } | awk '{ if (length > m) m = length } END { print m + 0 }')"
          fence="$(printf '%*s' "$(( longest < 3 ? 4 : longest + 1 ))" '' | tr ' ' '`')"

          # A major bump, above all leaving 0.x, is called out: it changes
          # the compatibility promise (docs/compatibility.md).
          # shellcheck source=/dev/null
          source scripts/release-preflight.sh
          tags="$(git ls-remote --tags --refs "https://github.com/$GITHUB_REPOSITORY" 'v*' | sed 's|.*refs/tags/||')"
          # shellcheck disable=SC2086 # one tag per word
          latest="$(latest_stable $tags)"
          major_note=""
          if [ -n "$latest" ] && [ "${base%%.*}" != "${latest%%.*}" ]; then
            major_note="**Major release:** $latest → $base."
            [[ "$latest" == v0.* ]] && major_note="$major_note It leaves 0.x: from here on the compatibility contract applies."
          fi
          {
            if [ "$DRY_RUN" = true ]; then
              echo "## Dry run of $VERSION: nothing will be published"
            else
              echo "## Approve publishing Trustvian $VERSION?"
              echo
              echo "Approving the \`release\` deployment of this run creates the annotated tag \`$VERSION\` at the commit below, publishes the GitHub Release$([ "$PRERELEASE" = true ] && echo ' as a **prerelease**'), and tags the verified image. It cannot be undone."
            fi
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Version | \`$VERSION\`$([ "$PRERELEASE" = true ] && echo ' (prerelease)') |"
            echo "| Commit | [\`${COMMIT:0:12}\`](https://github.com/$GITHUB_REPOSITORY/commit/$COMMIT) on \`main\` |"
            echo "| Derived (as stated by the dispatcher) | \`$derivation\` |"
            echo "| Operator (as reported by scripts/release.sh) | \`$OPERATOR\` — dispatched by @$GITHUB_TRIGGERING_ACTOR |"
            echo "| Newest stable tag | \`${latest:-none}\` |"
            echo "| Image | \`$IMAGE@$DIGEST\` |"
            echo
            if [ -n "$major_note" ]; then
              echo "> [!WARNING]"
              echo "> $major_note"
              echo
            fi
            echo "### Checks"
            echo
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=50" \
              --jq '.jobs[] | select(.name != "Approval summary" and .name != "Publish") | "- \(.name): **\(.conclusion // .status)**"'
            echo
            echo "### CHANGELOG"
            echo
            echo "${fence}markdown"
            printf '%s\n' "$section"
            echo "$fence"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish
    needs: [preflight, gates, build, image, verify, summary]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The human gate: required reviewers (the Organization Admins) approve
    # this deployment on GitHub before any step below runs.
    environment: release
    # The tag and the GitHub Release are written with the trustvian-release
    # App's token, minted below; GITHUB_TOKEN only reads the source, pushes
    # image tags to GHCR and reads the approvals. No job holds contents: write.
    permissions:
      contents: read
      packages: write
      # To read who approved this run's deployment, for the summary.
      actions: read

    steps:

      - name: Operator
        run: |
          echo "**Operator:** \`$OPERATOR\` (as reported by scripts/release.sh; informational) · **Triggered by:** @$GITHUB_TRIGGERING_ACTOR" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # release-notes.md, exactly as preflight checked it.
          persist-credentials: false
          ref: ${{ inputs.commit }}

      - id: app
        name: Mint the release App's token
        # The only place the App's key is used. The private key is a secret of
        # the `release` environment, so it exists only in this job, after a
        # required reviewer approved it. The token is scoped to this
        # repository and to contents: write, and is revoked when the job ends.
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: 1. Create the release tag
        # An annotated tag at exactly $COMMIT, created through the API as
        # trustvian-release[bot], now that a person has approved. An existing tag
        # is accepted only if it is that same annotated tag (a re-run);
        # anything else stops here, before anything is published.
        env:
          # Authored by trustvian-release[bot], the only actor the ruleset
          # lets create a tag.
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          if ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$VERSION" 2>/dev/null)"; then
            if [ "$(jq -r .object.type <<<"$ref")" != tag ]; then
              echo "::error::$VERSION already exists as a lightweight tag; a release tag is annotated. Nothing was published."
              exit 1
            fi
            target="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$(jq -r .object.sha <<<"$ref")" \
              --jq '"\(.object.type) \(.object.sha)"')"
            if [ "$target" != "commit $COMMIT" ]; then
              echo "::error::$VERSION already exists at '$target', not commit $COMMIT. Nothing was published."
              exit 1
            fi
            echo "ok: $VERSION is already the annotated tag at $COMMIT"
          else
            object="$(gh api "repos/$GITHUB_REPOSITORY/git/tags" \
              -f tag="$VERSION" -f message="Trustvian $VERSION" -f object="$COMMIT" -f type=commit --jq .sha)"
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$VERSION" -f sha="$object" >/dev/null
            echo "ok: created the annotated tag $VERSION at $COMMIT"
          fi

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist

      - id: newest
        name: Is this the newest stable release?
        # Decides --latest and the floating tags. Computed now, not assumed, so
        # re-running an older release's publish after a newer one has shipped
        # cannot point `latest` back at it.
        env:
          PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
        run: |
          set -euo pipefail
          newest=false
          if [ "$PRERELEASE" != true ]; then
            # shellcheck source=/dev/null
            source scripts/release-preflight.sh
            newest=true
            for tag in $(git ls-remote --tags --refs "https://github.com/$GITHUB_REPOSITORY" 'v*' | sed 's|.*refs/tags/||'); do
              [ "$tag" = "$VERSION" ] && continue
              if ! is_semver "$tag" || is_prerelease "$tag"; then continue; fi
              if [ "$(semver_cmp "$VERSION" "$tag")" != 1 ]; then
                newest=false
                echo "::notice::$tag is newer than $VERSION: latest and the floating tags stay where they are"
              fi
            done
          fi
          echo "newest=$newest" >> "$GITHUB_OUTPUT"

      - name: 2. GitHub Release
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
          NEWEST: ${{ steps.newest.outputs.newest }}
        run: |
          set -euo pipefail
          kind_args=(--latest=false)
          [ "$NEWEST" = true ] && kind_args=(--latest)
          [ "$PRERELEASE" = true ] && kind_args=(--prerelease --latest=false)
          assets=(dist/*.tar.gz dist/*.zip dist/checksums.txt)
          want="$(for a in "${assets[@]}"; do basename "$a"; done | sort)"

          state="$(gh release view "$VERSION" --json isDraft,assets,author 2>/dev/null || true)"
          if [ -n "$state" ] && [ "$(jq -r .isDraft <<<"$state")" = true ] &&
            [ "$(jq -r '.author.login // ""' <<<"$state")" != "trustvian-release[bot]" ]; then
            # A draft somebody else left, such as one from before the App.
            # A release keeps its author when published, and the audit
            # requires trustvian-release[bot], so it is replaced, not
            # finished. A draft is not public; the tag is left alone.
            gh release delete "$VERSION" --yes
            echo "removed a draft of $VERSION authored by $(jq -r '.author.login // "unknown"' <<<"$state")"
            state=""
          fi

          if [ -n "$state" ]; then
            if [ "$(jq -r .isDraft <<<"$state")" = true ]; then
              # The App's own draft for this tag: an interrupted create (gh
              # creates a draft, uploads, then publishes). Make it exactly
              # this release before publishing it: these assets and no
              # others, this title and these notes.
              for name in $(jq -r '.assets[].name' <<<"$state"); do
                if ! grep -Fxq -- "$name" <<<"$want"; then
                  gh release delete-asset "$VERSION" "$name" --yes
                  echo "removed stray asset $name from the draft"
                fi
              done
              gh release upload "$VERSION" "${assets[@]}" --clobber
              gh release edit "$VERSION" --title "Trustvian $VERSION" --notes-file release-notes.md \
                --draft=false "${kind_args[@]}"
              echo "ok: finished the draft release $VERSION"
            else
              have="$(jq -r '.assets[].name' <<<"$state" | sort)"
              if [ "$have" != "$want" ]; then
                echo "::error::$VERSION is already published with different assets"
                diff <(echo "$want") <(echo "$have") || true
                exit 1
              fi
              echo "ok: $VERSION is already published with every asset"
            fi
          else
            gh release create "$VERSION" \
              --verify-tag \
              --title "Trustvian $VERSION" \
              --notes-file release-notes.md \
              "${kind_args[@]}" \
              "${assets[@]}"
            echo "ok: published $VERSION"
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 3. Image version tag, from the verified digest
        env:
          IMAGE: ${{ needs.image.outputs.image }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          set -euo pipefail
          # A retag by digest, no rebuild. An existing version tag on another
          # digest is refused: a version tag never moves.
          # Only a registry that answers "no such tag" means absent. Any
          # other failure (auth, network, rate limit) stops here, because
          # treating it as absent would let the create below move a tag.
          if current="$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{.Manifest.Digest}}' 2>"$RUNNER_TEMP/inspect.err")"; then
            if [ "$current" != "$DIGEST" ]; then
              echo "::error::$IMAGE:$VERSION already points at $current, not $DIGEST"
              exit 1
            fi
            echo "ok: $IMAGE:$VERSION already points at $DIGEST"
          elif grep -Eqi 'not found|manifest unknown|MANIFEST_UNKNOWN' "$RUNNER_TEMP/inspect.err"; then
            docker buildx imagetools create -t "$IMAGE:$VERSION" "$IMAGE@$DIGEST"
            echo "ok: tagged $IMAGE:$VERSION"
          else
            cat "$RUNNER_TEMP/inspect.err"
            echo "::error::could not tell whether $IMAGE:$VERSION exists; nothing was tagged. Re-run this job."
            exit 1
          fi

      - name: 4. Floating tags, for the newest stable release
        if: steps.newest.outputs.newest == 'true'
        env:
          IMAGE: ${{ needs.image.outputs.image }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          set -euo pipefail
          minor="${VERSION#v}"; minor="${minor%.*}"
          # One retag per call: two -t flags in one call behaved
          # inconsistently when verified during task 045.
          for floating in "$minor" latest; do
            docker buildx imagetools create -t "$IMAGE:$floating" "$IMAGE@$DIGEST"
          done
          echo "ok: $IMAGE:$minor and :latest point at $DIGEST"

      - name: Summarize
        if: always()
        env:
          # GITHUB_TOKEN reads the approvals; the App's token reads the release.
          GH_TOKEN: ${{ github.token }}
          APP_TOKEN: ${{ steps.app.outputs.token }}
          IMAGE: ${{ needs.image.outputs.image }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          url="$(GH_TOKEN="$APP_TOKEN" gh release view "$VERSION" --json url --jq .url 2>/dev/null || echo "(no release)")"
          {
            echo "### Trustvian $VERSION"
            echo
            echo "- Release: $url"
            echo "- Image: \`$IMAGE:$VERSION\` = \`$IMAGE@$DIGEST\`"
            echo "- Commit: \`$COMMIT\`"
            echo "- Operator: \`$OPERATOR\` (informational) · triggered by @$GITHUB_TRIGGERING_ACTOR"
            echo "- Approved by (GitHub's record):"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals" \
              --jq '.[] | "  - @\(.user.login): \(.state)\(if (.comment // "") != "" then " — \(.comment)" else "" end)"' 2>/dev/null ||
              echo "  - (could not read the approvals)"
            echo
            echo "Verify an archive:"
            echo
            echo '```bash'
            echo "gh attestation verify trustvian_${VERSION}_linux_amd64.tar.gz \\"
            echo "  --repo $GITHUB_REPOSITORY \\"
            echo "  --signer-workflow $GITHUB_REPOSITORY/.github/workflows/release.yml \\"
            echo "  --source-ref refs/heads/main --source-digest $COMMIT"
            echo '```'
            echo
            echo "Verify the image:"
            echo
            echo '```bash'
            echo "cosign verify $IMAGE@$DIGEST \\"
            echo "  --certificate-identity https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/heads/main \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com \\"
            echo "  --certificate-github-workflow-repository $GITHUB_REPOSITORY \\"
            echo "  --certificate-github-workflow-trigger workflow_dispatch \\"
            echo "  --certificate-github-workflow-sha $COMMIT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
