# Tag-triggered release: validate the tag, re-run the quality gates against
# the tagged source, build the artifact matrix, and publish a GitHub
# Release with the binaries and their checksums attached.
#
# Written and structurally validated by
# docs/tasks/040-release-artifacts-and-module-consistency.md, which
# deliberately publishes nothing. It has run since: v0.9.0-rc.1 and rc.2
# failed, each failure becoming a gate (see docs/release-guide.md), and
# v0.9.0-rc.3 and v0.9.0 passed on 2026-09-17.
#
# Everything it builds can be built locally first — `make release-dry-run`
# runs the same script — so a broken target is found before a tag exists
# rather than after.
#
# The container job below extends this same release identity rather than
# forming a second one: it `needs` the release job, so the image is built
# from source whose tag was already validated and whose gates already
# passed. See docs/tasks/041-container-supply-chain-security.md
# § Release integration.

name: Release

on:
  push:
    tags:
      - "v*"

# Read by default. Only the publishing job widens this, and only to
# contents: write — the scope GitHub requires to create a release. No
# packages: write and no id-token: write; nothing here pushes an image or
# requests an OIDC token.
permissions:
  contents: read

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    services:
      # The same PostgreSQL service ci.yml uses, so the release gates cover
      # the persistence guarantees rather than skipping them.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: trustvian
          POSTGRES_PASSWORD: trustvian
          POSTGRES_DB: trustvian_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trustvian -d trustvian_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7
        with:
          # No token in .git/config: nothing after checkout needs one.
          persist-credentials: false
          # github.ref is the tag, so this checks out the tagged commit —
          # never a branch head that may have moved since the tag was cut.
          ref: ${{ github.ref }}
          # Full history so `git describe` and tag verification work.
          fetch-depth: 0

      - name: Validate tag is SemVer
        env:
          # Through the environment, not string-interpolated into the
          # script body: a tag name is attacker-influenceable in principle,
          # and interpolation would make it executable shell.
          TAG: ${{ github.ref_name }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::tag '$TAG' is not a valid SemVer release tag (want vMAJOR.MINOR.PATCH[-prerelease][+build])"
            exit 1
          fi
          echo "Releasing $TAG"

      - name: Verify checkout matches the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Proving, not assuming, that the working tree is the tagged
          # commit — the difference between releasing what was reviewed and
          # releasing whatever main happened to hold.
          tagged="$(git rev-list -n 1 "refs/tags/$TAG")"
          head="$(git rev-parse HEAD)"
          if [ "$tagged" != "$head" ]; then
            echo "::error::HEAD ($head) is not the commit tagged $TAG ($tagged)"
            exit 1
          fi
          echo "HEAD is the tagged commit: $head"

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # --- Quality gates, re-run against the exact tagged source ---------
      #
      # Not "some earlier workflow probably passed": that workflow ran on a
      # different commit, and a tag can be placed on anything.

      - name: Module consistency
        run: ./scripts/check-modules.sh

      - name: Format
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Race
        run: go test -race ./...

      - name: Test with PostgreSQL
        env:
          TRUSTVIAN_TEST_POSTGRES_DSN: postgres://trustvian:trustvian@localhost:5432/trustvian_test?sslmode=disable
        run: go test -race -short ./...

      - name: Processor module (GOWORK=off)
        env:
          GOWORK: "off"
        working-directory: processor
        run: |
          go build ./...
          go vet ./...
          go test -race ./...

      - name: Go vulnerability scan
        # Re-run here, not inherited from CI: the vulnerability database moves
        # independently of the code, so a commit that scanned clean when it
        # merged can carry a reachable advisory by the time it is tagged.
        # Both modules whose code ships — the CLI binaries and the image.
        # GOWORK=off for the same reason as ci.yml.
        env:
          GOWORK: "off"
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...
          (cd processor && go run golang.org/x/vuln/cmd/govulncheck@latest ./...)

      # --- Artifacts -----------------------------------------------------
      #
      # The same script a maintainer runs locally. Every target must build:
      # the script exits non-zero on the first failure, so the publish step
      # below never runs for a partial matrix.

      - name: Build release artifacts
        env:
          TAG: ${{ github.ref_name }}
        run: ./scripts/release-build.sh "$TAG"

      - name: Verify checksums
        working-directory: dist
        run: sha256sum -c checksums.txt

      # --- Publish -------------------------------------------------------

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # --verify-tag so the release cannot be created for a tag that
          # does not exist. Notes come from CHANGELOG.md via --notes-file
          # when a maintainer has prepared them; otherwise the release is
          # created as a draft for them to finish, rather than publishing
          # an auto-generated commit dump.
          notes_args=(--generate-notes)
          if [ -f "release-notes.md" ]; then
            notes_args=(--notes-file release-notes.md)
          fi

          # A prerelease tag is marked as one, using the same test that
          # decides whether floating image tags move. Without this, a
          # published v0.9.0-rc.1 draft would have become GitHub's "Latest
          # release" — a release candidate presented as the stable version
          # to everyone landing on the repository.
          release_args=()
          if printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            kind="release"
          else
            release_args=(--prerelease)
            kind="prerelease"
          fi

          gh release create "$TAG" \
            --title "Trustvian $TAG" \
            --verify-tag \
            --draft \
            "${release_args[@]}" \
            "${notes_args[@]}" \
            dist/*.tar.gz dist/*.zip dist/checksums.txt

          echo "::notice::Draft $kind created for $TAG. Review the notes against CHANGELOG.md, then publish it."

  # ---------------------------------------------------------------------
  # Official container image: build, scan, publish, sign, attest.
  #
  # Depends on the release job, so it inherits that job's verified tag and
  # passing gates instead of re-establishing trust in the source. One
  # release identity, two artifact kinds.
  #
  # Ordering is build -> scan -> gate -> push (immutable tag) -> sign ->
  # promote floating tags, so a known-bad image is never published and the
  # floating tags (`X.Y`, `latest`) only ever point at a signed digest.
  # Signing follows the push because Cosign signs a digest, which exists only
  # once the image is in the registry.
  # ---------------------------------------------------------------------
  container:
    name: Container image
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      # Read source; write packages to push to GHCR; id-token for keyless
      # Cosign signing. contents: write is deliberately absent — this job
      # does not touch GitHub Release state.
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          # No token in .git/config: nothing after checkout needs one.
          persist-credentials: false
          # The tagged commit, exactly as the release job used. The image
          # and the binaries are built from the same source.
          ref: ${{ github.ref }}

      - name: Resolve the image repository
        # One source for every step below — build, scan, push, sign, retag —
        # so it is not possible to scan one repository and sign another.
        #
        # Not `ghcr.io/${{ github.repository_owner }}/...`: that is the
        # organization's display name, `Trustvian`, and an OCI repository
        # must be lowercase. v0.9.0-rc.2 failed on exactly that, at the first
        # container step. scripts/image-name.sh normalizes and validates it,
        # and scripts/test-image-name.sh keeps it that way.
        run: echo "IMAGE=$(./scripts/image-name.sh)" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # The workflow-scoped token, not a stored PAT: nothing long-lived
          # to leak or rotate.
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- Build and scan before publishing ------------------------------

      - name: Build for scanning
        # Single platform and --load, because a multi-platform result cannot
        # be loaded into the local daemon for a scanner to read. The
        # multi-arch push below reuses this build's cache, so the pushed
        # amd64 layer is the artifact scanned here; see
        # docs/supply-chain.md § What the scan covers.
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --load \
            -t "$IMAGE:scan" \
            .

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:scan
          format: table
          severity: CRITICAL,HIGH
          # Only findings with a fix can be acted on by rebuilding; an
          # unfixed upstream advisory must not block shipping our own
          # security fixes. Policy and exceptions: docs/supply-chain.md.
          ignore-unfixed: true
          exit-code: "1"
          scanners: vuln

      # --- Publish -------------------------------------------------------

      - name: Build and push the immutable tag
        id: push
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # ONLY the immutable vX.Y.Z tag here. The floating tags are moved
          # after signing succeeds (below), so a failure between push and
          # sign can never leave `latest` pointing at an unsigned image —
          # someone pulling a floating tag has not opted into checking.
          #
          # BuildKit's own SBOM (SPDX) and SLSA provenance attestations,
          # attached to the image in the registry. Platform-standard rather
          # than a bespoke format, and no extra tool in the release path.
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --sbom=true \
            --provenance=mode=max \
            -t "$IMAGE:$TAG" \
            --metadata-file /tmp/metadata.json \
            --push \
            .

          digest="$(python3 -c "import json;print(json.load(open('/tmp/metadata.json'))['containerimage.digest'])")"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "::notice::pushed $IMAGE:$TAG@$digest"

      # --- Sign ----------------------------------------------------------

      - name: Install Cosign
        # Pinned to an exact release: sigstore/cosign-installer publishes
        # only full version tags and no floating major, so `@v4` is not a
        # ref that exists — which is exactly how v0.9.0-rc.1 failed, at job
        # setup, before any step ran. `scripts/check-action-refs.sh` now
        # checks every `uses:` ref against the API so this class of error
        # cannot reach a tag again.
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign the image
        # Keyless: identity comes from this workflow's OIDC token, so there
        # is no private key in the repository or in a secret. Signs the
        # digest rather than a tag, because a tag can later move.
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      # --- Promote floating tags ------------------------------------------

      - name: Promote floating tags
        env:
          TAG: ${{ github.ref_name }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          # A retag by digest: no rebuild, so `X.Y` and `latest` resolve to
          # exactly the signed, attested index pushed above. A prerelease
          # never moves them — someone tracking `latest` has not opted into
          # release candidates.
          if printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            minor="${TAG#v}"; minor="${minor%.*}"
            # One retag per call. Verified against a registry during task 045:
            # every tag resolves to the pushed digest. Two -t flags in a single
            # call behaved inconsistently in that verification, so they are
            # not combined.
            for floating in "$minor" latest; do
              docker buildx imagetools create -t "$IMAGE:$floating" "$IMAGE@$DIGEST"
            done
            echo "::notice::$IMAGE:$minor and :latest now point at $DIGEST"
          else
            echo "::notice::prerelease $TAG — floating tags left unchanged"
          fi

      - name: Summarize
        env:
          TAG: ${{ github.ref_name }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### Container image"
            echo
            echo '```'
            echo "$IMAGE:$TAG"
            echo "$IMAGE@$DIGEST"
            echo '```'
            echo
            echo "Signed keylessly; SBOM and SLSA provenance attached as attestations."
            echo "Verification: docs/supply-chain.md"
          } >> "$GITHUB_STEP_SUMMARY"
