# Quality gates for every module and boundary a Trustvian release depends
# on. These are the same checks this project has run by hand on every task
# since v0.1 (see CONTRIBUTING.md and the Makefile) — this workflow makes
# them automatic rather than a matter of discipline.
#
# Publishing is deliberately NOT here. This workflow creates no release,
# image, or artifact, which is why it can run with read-only permissions
# and needs no secrets at all. Publishing, scanning the image, and signing
# live in release.yml, which runs only on a version tag.
#
# See docs/tasks/039-ci-quality-gate-automation.md.

name: CI

on:
  push:
    # `main` is the only long-lived branch: every change reaches it by pull
    # request, so gating those pull requests is what keeps it releasable.
    # The push trigger covers the merge itself and anything a maintainer
    # lands directly. See docs/governance/branching.md.
    branches: [main]
  pull_request:
    branches: [main]

# Read-only. This workflow publishes nothing, so it needs no write scope
# anywhere. A fork pull request therefore cannot obtain credentials,
# because the job has none to obtain.
permissions:
  contents: read

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------
  # Root module: the engine, CLI, and public API.
  # ---------------------------------------------------------------------
  root:
    name: Root module
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # PostgreSQL for the v0.8 persistence guarantees. The integration
      # tests skip themselves when TRUSTVIAN_TEST_POSTGRES_DSN is unset, so
      # providing it here is what turns them on — no test is modified and
      # no second gating mechanism is introduced.
      #
      # These credentials are ephemeral and scoped to this job. They are
      # not secrets and must never be replaced by one: a workflow that
      # needs a real DSN could not run on fork pull requests.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: trustvian
          POSTGRES_PASSWORD: trustvian
          POSTGRES_DB: trustvian_test
        ports:
          - 5432:5432
        # Readiness, not a sleep: the job starts when PostgreSQL says it
        # is ready to accept connections.
        options: >-
          --health-cmd "pg_isready -U trustvian -d trustvian_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7
        with:
          # Tags, without the cost of full history. scripts/check-modules.sh
          # verifies that each module's declared root version is real, and a
          # local tag answers that offline; without tags it falls back to
          # querying the module proxy on every run. checkout fetches no tags
          # by default, which is exactly why this check failed in CI while
          # passing locally.
          fetch-tags: true

      - uses: actions/setup-go@v7
        with:
          # From go.mod, so the CI toolchain cannot drift from the version
          # the module itself declares.
          go-version-file: go.mod
          cache: true

      - name: Format
        # gofmt -l prints offending files and exits 0, so the exit status
        # alone proves nothing — the output is the signal.
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi

      - name: Module consistency
        # Catches module drift on the pull request that introduces it,
        # rather than during a release. See scripts/check-modules.sh.
        run: ./scripts/check-modules.sh

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Race
        run: go test -race ./...

      - name: Go vulnerability scan
        # Symbol-level reachability, not just "a vulnerable module is in the
        # graph": this repository's processor carries advisories its code
        # cannot reach, which a graph-only scanner would report as findings
        # to triage. Run via `go run` so no tool is added to the module's
        # dependencies.
        #
        # GOWORK=off explicitly. go.work is gitignored, so it exists on
        # developer machines and not here; with it active, MVS raises this
        # module's dependency versions to satisfy the other workspace
        # members, which can hide a vulnerability that a real consumer of
        # this module alone would be exposed to. The module's own build list
        # is the one that matters.
        env:
          GOWORK: "off"
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Test with PostgreSQL
        # -short runs the integration tier but skips the expensive stress
        # tier, which is scheduled nightly instead (see nightly.yml and the
        # tier table in docs/tasks/039-ci-quality-gate-automation.md).
        env:
          TRUSTVIAN_TEST_POSTGRES_DSN: postgres://trustvian:trustvian@localhost:5432/trustvian_test?sslmode=disable
        run: go test -race -short ./...

  # ---------------------------------------------------------------------
  # Backup, restore, and upgrade (task 044): proves learned behavioral state
  # survives pg_dump -> pg_restore into a fresh database by BEHAVIOR, that an
  # online backup under concurrent writes is consistent, that every failure
  # fails closed, and that upgrading from the real previous release preserves
  # state. Seconds of test time; a separate job only because it needs
  # PostgreSQL 17 client tools, which the runner image does not ship.
  # ---------------------------------------------------------------------
  backup-restore:
    name: Backup, restore & upgrade
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: trustvian
          # Ephemeral and job-scoped, like the root job's. Distinctive on
          # purpose: the tests assert this string never appears in script
          # output or backup metadata, which a password equal to the user
          # name ("trustvian") would make impossible to check.
          POSTGRES_PASSWORD: tv-ci-backup-restore-pw
          POSTGRES_DB: trustvian_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trustvian -d trustvian_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The upgrade source. A real release, built from its tag below — never
      # a fabricated fixture. Advance it when a newer release exists.
      UPGRADE_FROM: v0.8.0

    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, so the previous release's tagged source — not just
          # its tag ref — is present to build from.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install PostgreSQL 17 client tools
        # From the PostgreSQL project's own apt repository, matching the
        # server's major version: pg_dump refuses a newer server, and the
        # scripts are meant to be exercised with the tools an operator uses.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Build the previous release CLI from its tag
        run: |
          git worktree add --detach "$RUNNER_TEMP/upgrade-from" "$UPGRADE_FROM"
          (cd "$RUNNER_TEMP/upgrade-from" && GOWORK=off go build -o "$RUNNER_TEMP/trustvian-$UPGRADE_FROM" ./cmd/trustvian)

      - name: Backup, restore, and upgrade tests
        env:
          TRUSTVIAN_TEST_BACKUP_RESTORE: "1"
          TRUSTVIAN_TEST_POSTGRES_DSN: postgres://trustvian:tv-ci-backup-restore-pw@localhost:5432/trustvian_test?sslmode=disable
        run: |
          pg_dump --version
          TRUSTVIAN_TEST_UPGRADE_FROM_BINARY="$RUNNER_TEMP/trustvian-$UPGRADE_FROM" \
          TRUSTVIAN_TEST_UPGRADE_FROM_VERSION="$UPGRADE_FROM" \
            go test -race -count=1 -v -run 'Backup|Restore|Upgrade' ./scripts/

  # ---------------------------------------------------------------------
  # Processor module: a separate Go module that resolves the core module
  # through a replace directive. GOWORK=off is the point of this job — a
  # workspace would mask a broken module boundary, and this module's
  # buildability outside the workspace is release-critical.
  # ---------------------------------------------------------------------
  processor:
    name: Processor module (GOWORK=off)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOWORK: "off"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: processor/go.mod
          cache: true
          cache-dependency-path: processor/go.sum

      - name: Format
        working-directory: processor
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        working-directory: processor
        run: go vet ./...

      - name: Build
        working-directory: processor
        run: go build ./...

      - name: Test
        working-directory: processor
        run: go test ./...

      - name: Race
        working-directory: processor
        run: go test -race ./...

      - name: Go vulnerability scan
        working-directory: processor
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # ---------------------------------------------------------------------
  # Examples module: also separate, and the repository's proof that the
  # public API is usable from outside. Run with GOWORK=off for the same
  # reason as the processor — an external consumer has no workspace.
  # ---------------------------------------------------------------------
  examples:
    name: Examples module (GOWORK=off)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOWORK: "off"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: examples/go.mod
          cache: true
          cache-dependency-path: examples/go.sum

      - name: Format
        working-directory: examples
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        working-directory: examples
        run: go vet ./...

      - name: Build
        working-directory: examples
        run: go build ./...

      - name: Test
        working-directory: examples
        run: go test ./...

      - name: Go vulnerability scan
        working-directory: examples
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: No internal imports
        # examples/ exists to prove the public API is sufficient. An
        # internal/* import here would compile inside this repository and
        # break for every real external consumer.
        working-directory: examples
        run: |
          if grep -rn "github.com/trustvian/trustvian/internal" --include="*.go" .; then
            echo "::error::examples must not import internal/* — they model an external consumer"
            exit 1
          fi

  # ---------------------------------------------------------------------
  # Platform module: the control-plane domain (task 052). Separate for the
  # reason ADR 0022 gives — its module path is deliberately NOT under
  # github.com/trustvian/trustvian, so Go's internal/ rule makes a core
  # internal import a compile error rather than a convention.
  #
  # GOWORK=off for the same reason as the processor and examples: a
  # workspace resolves dependencies the module does not declare, which is
  # exactly the breakage this job exists to find.
  # ---------------------------------------------------------------------
  platform:
    name: Platform module (GOWORK=off)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOWORK: "off"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: platform/go.mod
          cache: true
          cache-dependency-path: platform/go.mod

      - name: Format
        working-directory: platform
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        working-directory: platform
        run: go vet ./...

      - name: Build
        working-directory: platform
        run: go build ./...

      - name: Test
        working-directory: platform
        run: go test ./...

      - name: Test with the race detector
        working-directory: platform
        run: go test -race ./...

      - name: Go vulnerability scan
        # As of task 053 the module depends on the root through a local
        # replace, which pulls the root's own module graph into scope.
        working-directory: platform
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Core/platform boundary
        # ADR 0022 makes this a release gate, not a convention. It also
        # checks the direction the compiler cannot help with: that the core
        # does not depend on the platform.
        working-directory: .
        run: ./scripts/check-platform-boundary.sh

  # ---------------------------------------------------------------------
  # Release tooling: prove the artifact matrix still cross-compiles on
  # every change, so a broken target is found on the pull request that
  # breaks it rather than when a tag is pushed.
  #
  # This builds and discards. Nothing is uploaded and no release is
  # created — publishing happens only in release.yml, on a tag.
  # ---------------------------------------------------------------------
  release-dry-run:
    name: Release build (dry run)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build the release matrix
        run: ./scripts/release-build.sh

  # ---------------------------------------------------------------------
  # Official container image: prove it still builds on every change.
  #
  # Builds and discards — nothing is pushed and no registry credential is
  # used, which is why this job runs on fork pull requests like any other.
  # Publishing happens only in release.yml, on a tag.
  # ---------------------------------------------------------------------
  container-build:
    name: Container image (build only)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Image naming
        # The release workflow's own image name, resolved and tested here.
        # This job used to build `trustvian-collector:ci` — a bare name with
        # no registry — so it never evaluated the expression that produced
        # `ghcr.io/Trustvian/...` and failed v0.9.0-rc.2. Now a PR builds the
        # same reference a release does.
        run: |
          ./scripts/test-image-name.sh
          echo "IMAGE=$(./scripts/image-name.sh)" >> "$GITHUB_ENV"

      - name: Build the official image
        # Single platform here: this job answers "does it still build", and
        # the multi-arch matrix is exercised by the release workflow. Keeping
        # it to one platform keeps pull-request feedback fast. Tagged exactly
        # as the release build tags it for scanning; nothing is pushed.
        run: docker buildx build --platform linux/amd64 -t "$IMAGE:scan" .

  # ---------------------------------------------------------------------
  # Workflow action references: prove every `uses:` ref actually exists.
  #
  # Added after v0.9.0-rc.1 died at job setup on
  # `sigstore/cosign-installer@v4`, a version that has never existed. The
  # YAML was valid and actionlint was clean — only a network lookup can
  # catch it, and the release workflow itself runs only on a tag, so this
  # is the last place to catch it before one is created.
  #
  # Resolution is `git ls-remote` against the public repositories and needs
  # no token: the first version of this check used the GitHub API, which
  # failed here for one action while passing locally, and then reported a
  # valid reference as nonexistent.
  # ---------------------------------------------------------------------
  workflow-refs:
    name: Workflow action references
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: Test the checker
        # Its own tests first, including the two real lookups behind
        # TRUSTVIAN_TEST_ACTION_REFS_NETWORK — a checker that cannot tell a
        # missing ref from a failed lookup is worse than none, and this is
        # the environment where that distinction was got wrong.
        env:
          TRUSTVIAN_TEST_ACTION_REFS_NETWORK: "1"
        run: ./scripts/test-check-action-refs.sh

      - name: Verify every action reference resolves
        run: ./scripts/check-action-refs.sh

  # ---------------------------------------------------------------------
  # Pull request title: the squash commit subject, and therefore the only
  # subject line that reaches `main`. Branch commits are squashed away, so
  # this is the one worth validating.
  #
  # Pull requests only: on a push there is no title to check. That is also
  # why this job must never become a required status check — a required
  # check that does not report on every event leaves pull requests waiting
  # for a result that will never arrive.
  # ---------------------------------------------------------------------
  pr-title:
    name: Pull request title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: Test the checker
        run: ./scripts/test-check-pr-title.sh

      - name: Validate the pull request title
        env:
          # Through the environment, never interpolated into the command:
          # a title is untrusted text and ${{ }} would splice it into the
          # shell.
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: ./scripts/check-pr-title.sh

  # ---------------------------------------------------------------------
  # Reference deployment: validate that the Compose configuration parses.
  # The full smoke test builds images and is scheduled nightly instead.
  # ---------------------------------------------------------------------
  deployment:
    name: Reference deployment
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Validate Compose configuration
        working-directory: deployments/docker-compose
        run: docker compose config --quiet
