# Trustvian behavioral gate — RUN-SIDE FOUNDATION ONLY.
#
# Copy into your repository as .github/workflows/behavioral-gate.yml.
#
# What this does: runs your scenario (or suite) on every pull request, fails
# the check with the scenario's own exit code, and uploads the result
# document as an artifact. What it does NOT do yet: comment on the pull
# request. That is a separate, later job — see docs/ci-github-action.md —
# and it must never check out or execute pull request code. Do not add a
# comment step, or any write permission, to the job below.
#
# Before using it:
#   - Replace REPLACE_WITH_A_REVIEWED_TRUSTVIAN_COMMIT_SHA with the full
#     40-character commit of the Trustvian revision you have reviewed. As
#     written, the reference cannot resolve, so an unedited copy fails at
#     setup instead of running an unpinned action.
#   - Point `scenario:` at your scenario file, or use `suite:` and
#     `scenario-timeout:` for a directory of them.

name: Behavioral gate

# pull_request, never pull_request_target: the job below runs the pull
# request's own code, and pull_request_target would run it with a token that
# can write to your repository and with your secrets. The action refuses to
# run under pull_request_target and workflow_run.
on:
  pull_request:
    branches: [main]

# No workflow-level permissions. A workflow-level grant would reach the job
# that runs the workload; each job states the least it needs instead.

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # actions/checkout defaults to persist-credentials: true, which
          # writes the job's token into .git/config — where the workload this
          # job runs, and every dependency it loads, could read it. The
          # scenario needs your source, not the ability to push it. Keep this.
          persist-credentials: false

      # Runs `trustvian eval run --json`, uploads the result as the artifact
      # `trustvian-run`, and exits with the CLI's code: 0 PASS, 1 gate FAIL,
      # 2 usage, 3 operational. This step is the gate.
      - uses: trustvian/trustvian/.github/actions/trustvian-run@REPLACE_WITH_A_REVIEWED_TRUSTVIAN_COMMIT_SHA
        with:
          scenario: scenarios/support-login.yaml
